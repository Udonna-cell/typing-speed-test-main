<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>typing test</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="star-1">
    <img src="/assets/images/pattern-star-1.svg" alt="star 1" />
  </div>
  <div class="star-2">
    <img src="/assets/images/pattern-star-2.svg" alt="star 2" />
  </div>
  <div class="nav">
    <div class="logo">
      <img src="/assets/images/logo-small.svg" alt="logo" />
    </div>
    <div class="result-score">
      <div class="trophy">
        <img src="/assets/images/icon-personal-best.svg" alt="trophy" />
      </div>
      <p>Best: <span class="light">92 WPM</span></p>
    </div>
  </div>
  <div class="control-pannel">
    <div>
      <p>WPM:</p>
      <p>40</p>
    </div>
    <div>
      <p>Accuracy:</p>
      <p>90%</p>
    </div>
    <div>
      <p>Time:</p>
      <p>0:45</p>
    </div>
  </div>
  <div class="control no-highlight">
    <div>
      <p class="label">Difficulty:</p>
      <div class="display">
        <p>Easy</p>
        <img src="/assets/images/icon-down-arrow.svg" alt="down-arrow" />
      </div>
      <ul class="options">
        <li><span class="material-symbols-light--task-alt"></span>Easy</li>
        <li><span class="line-md--circle"></span>Medium</li>
        <li><span class="line-md--circle"></span>Hard</li>
      </ul>
    </div>
    <div>
      <p class="label">Mode:</p>
      <div class="display">
        <p>Timed (60s)</p>
        <img src="/assets/images/icon-down-arrow.svg" alt="down-arrow" />
      </div>
      <ul class="options">
        <li> <span class="material-symbols-light--task-alt"></span>Timed (60s)</li>
        <li> <span class="line-md--circle"></span>Passage</li>
      </ul>
    </div>
  </div>
  <div class="page no-highlight">
    <div class="cover">
      <div>
        <button class="btn start">Start Typing Test</button>
        <p>Or click the text and start typing</p>
        
      </div>
    </div>
    <input type="text" name="page-tracker" id="page-tracker" value="" autocomplete="off" 
  autocorrect="off" 
  autocapitalize="off" 
  spellcheck="false" />
    <p>
      <!-- This will contain the page Passage -->
    </p>
  </div>
  <section class="result">
    <article>
      <div class="icon">
        <img src="/assets/images/icon-new-pb.svg" alt="icon-completed" class="glow"/>
      </div>
      <h2>Test Completed!</h2>
      <p>Solid run. Keep pushing to beat your high score.</p>
    </article>
    <div class="wrapper">
      <div>
        <h3>WPM</h3>
        <p>85</p>
      </div>
      <div>
        <h3>Accuracy</h3>
        <p>90%</p>
      </div>
      <div>
        <h3>Characters</h3>
        <p><span>120</span>/<span>5</span></p>
      </div>
    </div>
  </section>
  <button class="btn restart">restart <img src="/assets/images/icon-restart.svg" alt="restart icon" /></button>
  <div class="pattern-confetti"><img src="/assets/images/pattern-confetti.svg" alt="pattern-confetti"></div>
  <script src="/js/index.js" type="text/javascript" charset="utf-8"></script>
</body>

</html>
